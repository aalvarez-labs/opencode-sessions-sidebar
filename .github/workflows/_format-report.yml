name: Format report (temporary)

on:
  push:
    branches:
      - "perf/idle-render-20261107"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Normalize formatting of the changed files
        run: |
          bunx prettier --write \
            docs/validation/resource-acceptance-criteria.md \
            test/resource-acceptance-criteria.test.ts \
            scripts/lib/resource-acceptance.ts \
            test/resource-acceptance.test.ts \
            scripts/benchmark-sidebar-runtime.ts \
            scripts/sidebar-resource-probe.ts \
            .github/workflows/isolated-steady-acceptance.yml
      - name: Typecheck independently of formatting
        run: bunx tsc --noEmit
      - name: Run the new unit tests
        run: bun test test/resource-acceptance.test.ts test/resource-acceptance-criteria.test.ts
      - name: Upload normalized source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted
          path: |
            docs/validation/resource-acceptance-criteria.md
            test/resource-acceptance-criteria.test.ts
            scripts/lib/resource-acceptance.ts
            test/resource-acceptance.test.ts
            scripts/benchmark-sidebar-runtime.ts
            scripts/sidebar-resource-probe.ts
            .github/workflows/isolated-steady-acceptance.yml
          include-hidden-files: true
          retention-days: 3
