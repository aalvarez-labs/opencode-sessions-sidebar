name: Format report (temporary)

on:
  push:
    branches:
      - "perf/idle-render-20261107"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Normalize formatting
        run: |
          bunx prettier --write \
            .github/workflows/isolated-terminal-validation.yml \
            docs/adr/ADR-0001-resource-acceptance-windows.md \
            docs/validation/steady-acceptance-results.md \
            scripts/benchmark-sidebar-sustained.ts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Run the acceptance tests
        run: bun test test/resource-acceptance.test.ts test/resource-acceptance-criteria.test.ts
      - name: Upload normalized source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formatted
          path: |
            .github/workflows/isolated-terminal-validation.yml
            docs/adr/ADR-0001-resource-acceptance-windows.md
            docs/validation/steady-acceptance-results.md
            scripts/benchmark-sidebar-sustained.ts
          include-hidden-files: true
          retention-days: 3
